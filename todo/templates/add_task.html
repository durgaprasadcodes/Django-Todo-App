{% extends 'base.html'%}

{% block content%}
<h1>{% if task %}Edit{% else %}Add {% endif %} Task</h1>
<form method="post">
    {%csrf_token%}
    <label for="title">Title :</label>
    <input type="text" name="title" id="title" required placeholder="Enter Task Title"
        value="{{ task.title | default_if_none:'' }}">
    <label for="description">Description :</label>
    <textarea required name="description" id="description" rows="5">{{task.description}}</textarea>
    <button>submit</button>
    <button><a href="{% url 'todo_list' %}">Cancel</a></button>
</form>
{% endblock %}
